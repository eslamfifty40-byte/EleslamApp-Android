name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace > build.log 2>&1
      - name: Show errors
        if: always()
        run: |
          grep -n -E "error:|What went wrong|Could not|Execution failed" build.log | head -15 | while IFS= read -r line; do echo "::error::$line"; done
          grep -A4 "What went wrong" build.log | head -10 | while IFS= read -r line; do echo "::error::$line"; done
      - uses: actions/upload-artifact@v4
        with:
          name: EslamApp-debug
          path: app/build/outputs/apk/debug/*.apk
