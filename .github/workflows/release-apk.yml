name: Release APK

on:
  push:
    branches:
      - azkar-build
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: $DIL1
          KEYSTORE_PASSWORD: $DIL2
          KEY_ALIAS: $DIL3
          KEY_PASSWORD: $DIL4
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf "%s" "$KEYSTORE_BASE64" | tr -d "[:space:]" | base64 --decode > "$RUNNER_TEMP/eslam-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/eslam-release.jks" >> "$GITHUB_ENV"
