name: Release APK
on:
  push:
    branches: [azkar-build]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk Eleslam.apk
      - run: gh release create "v1.${{ github.run_number }}" Eleslam.apk --title "Eleslam ${{ github.run_number }}" --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
